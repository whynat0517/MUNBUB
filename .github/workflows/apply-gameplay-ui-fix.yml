name: Repair quiz layout, timed scene and duel emotes
on:
  push:
    paths:
      - '.github/workflows/apply-gameplay-ui-fix.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gameplay-ui-fix
  cancel-in-progress: false
jobs:
  update-game:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: Apply verified gameplay changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64,gzip,subprocess
          patch=gzip.decompress(base64.b64decode(""))
          css=gzip.decompress(base64.b64decode(""))
          subprocess.run(["git","apply","--check"],input=patch,check=True)
          subprocess.run(["git","apply","--whitespace=nowarn"],input=patch,check=True)
          Path("munbub_quiz_scenes_2026.css").write_bytes(css)
          print("Applied four-file patch and canonical gameplay CSS",len(css))
          PY
      - name: Commit all changes to GitHub main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- munbub_layout_fix_20261105.css munbub_art_refresh_20261106.css munbub_quiz_scenes_2026.js munbub_duel_arena_2026.css munbub_quiz_scenes_2026.css
          sed -i 's/[[:blank:]]*$//' munbub_quiz_scenes_2026.js
          git add -- munbub_quiz_scenes_2026.js
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No changes'; exit 0
          fi
          git commit -m "Consolidate game layout, fix timed GIF and enlarge player emotes"
          git push origin HEAD:main
