name: Apply button and hourglass fixes
on:
  push:
    paths:
      - '.github/workflows/mb-home-hourglass-fix.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mb-home-hourglass-fix
  cancel-in-progress: false
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: Apply reviewed fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,gzip,hashlib,subprocess
          from pathlib import Path
          patch=gzip.decompress(base64.b64decode(Path("scripts/mb_hourglass_patch.b64").read_text().strip()))
          assert hashlib.sha256(patch).hexdigest()=="4a37f7d2581e8f4050495f3f70f20f03699e49a3b507d6166201fb34ce60c506"
          subprocess.run(["git","apply","--check"],input=patch,check=True)
          subprocess.run(["git","apply","--whitespace=nowarn"],input=patch,check=True)
          print("Applied home button, clock overlay, emote direction fixes")
          PY
      - name: Commit changes and trigger Vercel
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- munbub_nav_patch.js munbub_titles_patch.js munbub_public_patch.js munbub_art_refresh_20261106.css munbub_quiz_scenes_2026.css munbub_quiz_scenes_2026.js munbub_duel_arena_2026.css
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Remove duplicate button backgrounds and fix timed hourglass and emote tails"
            git push origin HEAD:main
          fi
